<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>reduce paint</title>
  <style>
    #footer {
      width: 400px;
      height: 100px;
      /* 切换注释查看效果 */
/*       position: fixed; */
      top: 0;
      left: 0;
      border: 1px solid #000;
    }

    #target {
      width: 200px;
      height: 200px;
      border: 1px solid #000;
      margin-top: 100px;
    }

    #target.active {
      height: 220px;
      background-color: #ff0000;
    }
  </style>
</head>
<body>
  <div id="target"></div>
  <div id="footer">
    fixed footer
  </div>
  <script>
    setTimeout(function() {
      var targetElement = document.getElementById('target');
      // 模拟页面渲染
      targetElement.classList.add('active');
    }, 3000);
  </script>
</body>
</html>
